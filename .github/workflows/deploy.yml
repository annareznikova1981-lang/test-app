name: Deploy to Beget

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Sync files to Beget
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: aiprepp0.beget.tech
        username: aiprepp0_git
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ./aiprepp0.beget.tech/public_html/
